name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint backend (skips gracefully until backend/pyproject.toml exists)
        run: |
          if [ -f backend/pyproject.toml ]; then
            pip install ruff
            (cd backend && ruff check .)
          else
            echo "backend not scaffolded yet — skipping"
          fi

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint frontend (skips gracefully until frontend/package.json exists)
        run: |
          if [ -f frontend/package.json ]; then
            (cd frontend && npm ci && npm run lint --if-present)
          else
            echo "frontend not scaffolded yet — skipping"
          fi

  # Test jobs (pytest w/ Postgres+Redis services, vitest) are added in Task 10
  # once the backend and frontend suites exist.
