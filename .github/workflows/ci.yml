name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f pyproject.toml ]; then
            pip install ruff
          else
            echo "backend not scaffolded yet — skipping"
          fi
      - name: Run ruff
        run: |
          if [ -f pyproject.toml ]; then
            ruff check .
          else
            echo "backend not scaffolded yet — skipping"
          fi

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "frontend not scaffolded yet — skipping"
          fi
      - name: Run eslint
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
          else
            echo "frontend not scaffolded yet — skipping"
          fi

  # Test jobs (pytest w/ Postgres+Redis services, vitest) are added in Task 10
  # once the backend and frontend suites exist.
